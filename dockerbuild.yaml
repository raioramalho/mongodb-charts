steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "us.gcr.io/${PROJECT_ID}/${REPO_NAME}/charts:${BRANCH_NAME}",
        "./docker/charts"
      ]

  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "us.gcr.io/${PROJECT_ID}/${REPO_NAME}/mongo:${BRANCH_NAME}",
        "./docker/mongo"
      ]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "us.gcr.io/${PROJECT_ID}/${REPO_NAME}/charts:${BRANCH_NAME}"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "us.gcr.io/${PROJECT_ID}/${REPO_NAME}/mongo:${BRANCH_NAME}"]

options:
  logging: CLOUD_LOGGING_ONLY